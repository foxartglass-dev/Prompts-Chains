# Nixpacks configuration for Railway
# Enables Puppeteer/Chrome support for screenshot functionality

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium"
]

[phases.install]
cmds = ["npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/nix/var/nix/profiles/default/bin/chromium"
