# Nixpacks configuration for Railway
# Enables Puppeteer/Chrome support for screenshot functionality

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium"
]

# Install apt packages for Chromium dependencies
aptPkgs = [
  "chromium-browser",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2t64"
]

[phases.install]
cmds = ["npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
